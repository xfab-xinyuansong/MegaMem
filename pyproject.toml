[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "megamem"
version = "0.1.0"
description = "MegaMem: source-resolved dual-view retrieval for persistent memory beyond the prompt."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "The Authors" }]
keywords = [
  "external-memory",
  "large-context",
  "retrieval-augmented-generation",
  "enterprise-search",
  "provenance",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "PyYAML>=6.0",
  "omegaconf>=2.3.0",
  "pydantic>=2.6.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
retrieval = [
  "chromadb>=0.5.0",
  "faiss-cpu>=1.7.4",
  "numpy>=1.26.0",
  "rank-bm25>=0.2.2",
  "sentence-transformers>=2.6.0",
  "tiktoken>=0.6.0",
]
llm = [
  "python-dotenv>=1.0.0",
]
local-models = [
  "accelerate>=0.29.0",
  "torch>=2.2.0",
  "transformers>=4.40.0",
]
documents = [
  "markdownify>=0.11.6",
  "openpyxl>=3.1.0",
  "pdfplumber>=0.11.0",
  "pymupdf>=1.24.0",
  "python-docx>=1.1.0",
  "python-pptx>=0.6.23",
]
evaluation = [
  "bert-score>=0.3.13",
  "nltk>=3.8.1",
  "pandas>=2.2.0",
  "pyarrow>=15.0.0",
  "rouge-score>=0.1.2",
  "scikit-learn>=1.4.0",
  "scipy>=1.12.0",
]
huggingface = [
  "datasets>=3.0.0",
]
dev = [
  "build>=1.2.0",
  "pytest>=8.0",
  "pytest-timeout>=2.3.0",
]

[project.urls]
Homepage = "https://cielara.ai"
Repository = "https://github.com/xfab-xinyuansong/MegaMem"
Issues = "https://github.com/xfab-xinyuansong/MegaMem/issues"

[project.scripts]
megamem = "megamem.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"megamem.methods.configs" = ["*.yaml"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
timeout = 10
