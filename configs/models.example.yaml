
aliases:
  chat_low:
    provider: general
    base_url_env: "LLM_API_BASE"
    api_key_env: "LLM_API_KEY"
    model: "YOUR_CHAT_MODEL"
    token_parameter: "max_tokens"
    family: "low-tier chat model"
    notes: "Used for high-volume build calls."

  chat_high:
    provider: general
    base_url_env: "LLM_API_BASE"
    api_key_env: "LLM_API_KEY"
    model: "YOUR_CHAT_MODEL"
    token_parameter: "max_tokens"
    family: "high-tier chat model"
    notes: "Swap this alias explicitly when replaying runs with a different model."

  judge:
    provider: general
    base_url_env: "LLM_API_BASE"
    api_key_env: "LLM_API_KEY"
    model: "YOUR_JUDGE_MODEL"
    token_parameter: "max_tokens"
    family: "judge model"
    notes: "Keep fixed across comparisons whenever possible."

  secondary_extraction:
    provider: general
    base_url_env: "SECONDARY_LLM_API_BASE"
    api_key_env: "SECONDARY_LLM_API_KEY"
    model: "YOUR_SECONDARY_LLM_MODEL"
    token_parameter: "max_tokens"
    family: "secondary extraction model"
    notes: "Use only when explicitly enabled in the run config."

embedding:
  provider: local
  model: "sentence-transformers/all-MiniLM-L6-v2"
  dim: 384
  notes: "Set MEGAMEM_LOCAL_EMBEDDING=0 and use EMBEDDING_API_* for the general hosted endpoint."

substitution_policy:
  - rule: "Every alias used by a run must resolve to one concrete model."
  - rule: "If an alias has `provider: UNRESOLVED`, code must raise RuntimeError."
  - rule: "Model substitutions require an explicit config change and a recorded run id."

paper_experiments:
  models:
    extraction: gpt-5.4-mini
    abstraction: gpt-5.4
    query: gpt-5.4
    answer: gpt-5.4
    attribution: gpt-5.4
    judge: gpt-5.4
    embedding: text-embedding-3-small
    reranker: null
  retrieval:
    candidate_depth: 20
    rerank_candidates: 100
    max_documents: 5
    evidence_budget: 4096
    answer_tokens: 800
    rrf_constant: 60
    original_weight: 1.0
    canonical_weight: 1.0
    expansion_weight: 0.5
    max_expansions: 3
    raw_view: true
    distilled_view: true
    query_expansion: true
    rerank: true
    attribution: true
    evidence_policy: selective_detail
    backend: dual
    evidence_source: retrieved
  runtime:
    seed: 42
    timeout_seconds: 120
    retries: 2
    temperature: 0.0
  index:
    chunk_tokens: 400
    chunk_overlap: 0
    abstraction_group_size: 12
    embedding_dimensions: 1536
    encoding: cl100k_base
    enforce_token_cap: false
  evaluation:
    adapter: null
    score_scale: 100
    allow_unscored: true
  protocols:
    no_dual_index_view: null
    efficiency_extractor: null
    detailed_evidence_budget: null
    detailed_max_documents: null
  paths:
    questions: ../data/enterprise/questions.jsonl
    split_manifest: ../data/enterprise/split_manifest.json
    documents_template: ../data/enterprise/{scale}/documents.jsonl
    index_template: ../data/indexes/{dataset}/{scale}/{extractor}
    gold_evidence_template: ../data/enterprise/{scale}/gold_evidence.jsonl
    output_root: ../outputs/paper_experiments
  datasets:
    financebench:
      questions: ../data/financebench/questions.jsonl
      split_manifest: null
      documents_template: ../data/financebench/documents.jsonl
      index_template: ../data/indexes/{dataset}/{scale}/{extractor}
      gold_evidence_template: null
      output_root: ../outputs/paper_experiments
    hotpotqa:
      questions: ../data/hotpotqa/questions.jsonl
      split_manifest: null
      documents_template: ../data/hotpotqa/documents.jsonl
      index_template: ../data/indexes/{dataset}/{scale}/{extractor}
      gold_evidence_template: null
      output_root: ../outputs/paper_experiments
    locomo:
      questions: ../data/locomo/questions.jsonl
      split_manifest: null
      documents_template: ../data/locomo/documents.jsonl
      index_template: ../data/indexes/{dataset}/{scale}/{extractor}
      gold_evidence_template: null
      output_root: ../outputs/paper_experiments
    ultradomain:
      questions: ../data/ultradomain/questions.jsonl
      split_manifest: null
      documents_template: ../data/ultradomain/documents.jsonl
      index_template: ../data/indexes/{dataset}/{scale}/{extractor}
      gold_evidence_template: null
      output_root: ../outputs/paper_experiments
  parameter_provenance:
    manuscript: main-41.tex
    purpose: Executable protocol definitions without precomputed experimental results.
    paper_given:
      models: Atomic extraction uses gpt-5.4-mini; abstraction, query transformation, answering, attribution, and evaluation use gpt-5.4; embeddings use text-embedding-3-small.
      generation: Evidence is capped at 4096 tokens, answers at 800 tokens, and selected evidence at five unique documents outside the explicit full-detail diagnostic.
      runtime: Seed 42, temperature 0, 120-second timeout, and at most two retries.
      memory: Approximately 400 cl100k_base tokens per chunk, at most three typed memories per chunk, 1536-dimensional embeddings, and cosine retrieval.
      fusion: RRF constant 60; original and canonical routes receive greater weights than auxiliary expansions.
      split: Exactly 100 development and 400 disjoint validation question identifiers; all-500 diagnostics are separate from held-out validation.
      efficiency: Candidate depth 20, 100 sampled questions per scale, and the same selected questions across evidence policies.
      attribution: The answer is fixed before attribution; reported sources must be drawn from the loaded evidence.
    implementation_defaults:
      retrieval.candidate_depth: The value 20 is paper-specified only for evidence efficiency; its use for other suites is an implementation default.
      retrieval.rerank_candidates: The value 100 is an implementation default; the manuscript does not specify this pool size.
      retrieval.route_weights: Values 1.0, 1.0, and 0.5 implement the reported weight ordering; their exact values are not specified by the manuscript.
      retrieval.max_expansions: The value 3 is an implementation default, not a reported paper parameter.
      index.chunk_overlap: Zero overlap is an implementation default; the manuscript does not specify overlap.
      index.abstraction_group_size: The value 12 is an implementation default; the manuscript does not specify abstraction grouping.
      index.enforce_token_cap: Corpus tiers are supplied explicitly; strict cap validation is disabled by default and does not establish an exact historical tier match.
      evaluation.score_scale: Adapter scores are expected on a 0-to-100 scale, with invalid-document ratios on a 0-to-1 scale.
      evaluation.allow_unscored: Missing official scoring leaves official metrics null and does not fabricate scores.
    explicit_choices_required:
      models.reranker: The exact cross-encoder model is not identified in the manuscript.
      protocols.no_dual_index_view: Select raw or distilled explicitly; raw duplicates the no-distillation intervention and is marked equivalent in run metadata.
      protocols.efficiency_extractor: The historical retained-stack extractor is not specified; select mini or full explicitly for new runs.
      protocols.detailed_evidence_budget: The historical full-detail token budget is not specified; choose a value above 4096 explicitly.
      protocols.detailed_max_documents: The full-detail document limit is not specified and must be selected explicitly.
      evaluation.adapter: A verified canonical scorer is needed for official Overall, Correctness, Completeness, and InvDocs; no formula is inferred from reported table values.
    experiment_suites:
      headline:
        dataset: enterprise
        scale: 10M
        extractor: full
        split: validation
        question_count: 400
        implemented_variants: [full, no_query_expansion, no_attribution, bm25, dense]
        unavailable_exact_historical_rows: [hierarchy_only, relation_only, published_benchmark_leader, reranked_dual_view]
        distinction: The no-query-expansion diagnostic is not a claim to reproduce the earlier reranked-dual-view architecture.
      scaling:
        dataset: enterprise
        scales: [20M, 60M, 100M, 150M, 250M]
        extractor: mini
        split: validation
        question_count: 400
      ablation:
        dataset: enterprise
        scale: 10M
        extractor: full
        split: all
        question_count: 500
        variants: [full, no_query_expansion, no_reranker, no_distillation, no_dual_index, no_attribution]
      gold:
        dataset: enterprise
        scales: [20M, 60M, 250M]
        extractors: [mini, full]
        evidence_sources: [retrieved, gold]
        split: validation
        question_count: 400
        restriction: Gold chunks enter generation only in explicitly marked oracle runs.
      evidence_efficiency:
        dataset: enterprise
        scales: [10M, 20M]
        extractor: explicit_choice_required
        split: all
        sample_size: 100
        candidate_depth: 20
        policies: [selective_detail, detailed_only, distilled_only]
        distinction: New runs do not recreate the historical retained-trace estimate used for the paper's full-detail comparison.
      diagnostics:
        dataset: enterprise
        scale: 10M
        extractor: full
        split: all
        question_count: 500
        variants: [unconditional, no_expansion, no_attribution, selective_oracle]
        restriction: Selective oracle requires explicit answerability labels and is not a deployable learned gate.
      transfer:
        extractor: full
        split: task
        datasets:
          financebench: {question_count: 150, corpus_scope: question_local}
          hotpotqa: {question_count: 200, corpus_scope: question_local}
          locomo: {question_count: 200, corpus_scope: shared}
          ultradomain: {question_count: 200, corpus_scope: shared}
    reproducibility_limits:
      historical_sources: Existing legacy hierarchy and relation code does not establish exact configurations of the reported historical rows.
      historical_data: Original split identifiers, exact tier membership, external sample identifiers, and missed-target identifiers must be supplied; seed 42 alone does not recover them.
      question_local_data: FinanceBench and HotpotQA questions must provide explicit corpus_doc_ids; gold source identifiers do not define retrieval scope.
      metrics: Official scoring definitions and provenance come from the configured adapter, not the legacy BLEU, F1, or token-overlap evaluator.
      scale: The controlled scaling trace reaches 250M; dataset-wide 650M and prospective 1B claims are not implemented as measured results.
